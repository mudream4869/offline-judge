name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...
      - run: node --test scripts/benchjudge.test.mjs
      # build.sh 存版本號；換版本就整個重抓，只改 header/flags 時沿用已下載的套件
      - uses: actions/cache@v4
        with:
          path: .cache
          key: build-${{ hashFiles('scripts/build.sh') }}-${{ hashFiles('web/stdc++.h', 'web/cppflags.mjs') }}
          restore-keys: build-${{ hashFiles('scripts/build.sh') }}-
      - run: scripts/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
